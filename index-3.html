<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="description" content="JLPT N5–N1 일본어 문법 315개를 검색하고, 헷갈리는 문법을 나란히 비교하고, 퀴즈로 복습하는 오프라인 문법 사전.">
<title>일본어 문법 사전 · N5–N1</title>
<style>
/* ============================================================
   일본어 문법 사전 · N5–N1  —  styles
   mobile-first, single file, no external assets
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f7f5f0;
  --bg-soft:#efece4;
  --panel:#fffdf8;
  --panel-2:#fbf8f1;
  --ink:#22212a;
  --ink-2:#4b4854;
  --muted:#78737f;
  --faint:#a29caa;
  --line:#e6e0d4;
  --line-2:#efeae0;
  --accent:#b5432f;
  --accent-2:#8f3120;
  --accent-soft:#f7e6e0;
  --indigo:#3c5064;
  --indigo-soft:#e6ecf1;
  --good:#257a52;
  --good-soft:#e2f2e9;
  --bad:#b03a3a;
  --bad-soft:#fbe6e6;
  --n5:#2f7d5a;
  --n5-bg:#e4f1ea;
  --n4:#2a7183;
  --n4-bg:#e1eef2;
  --n3:#8a6a17;
  --n3-bg:#f5ecd6;
  --n2:#b25a1f;
  --n2-bg:#fbe9db;
  --n1:#9c2f34;
  --n1-bg:#f8e3e3;
  --radius:16px;
  --shadow:0 1px 2px rgba(34,33,42,.05), 0 8px 24px rgba(34,33,42,.05);
  --shadow-lg:0 18px 48px rgba(24,22,20,.18);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo",
          "Malgun Gothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 420px at 50% -160px, #fffaf0 0%, rgba(255,250,240,0) 70%),
    var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  padding-bottom: calc(64px + var(--safe-b));
}
button{font-family:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:disabled{cursor:default; opacity:.5}
a{color:var(--accent); text-decoration:none}
input,select,textarea{font-family:inherit; font-size:15px; color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0; padding:0; list-style:none}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:8px}
::selection{background:var(--accent-soft)}

/* ---------- app bar ---------- */
.appbar{
  position:sticky; top:0; z-index:40;
  background:rgba(247,245,240,.86);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.appbar-in{max-width:700px; margin:0 auto; padding:11px 16px 9px}
.brand{display:flex; align-items:center; gap:11px}
.logo{
  width:38px; height:38px; flex:0 0 38px; border-radius:12px;
  display:grid; place-items:center;
  background:linear-gradient(145deg,#3c5064,#26333f);
  color:#fff; font-size:19px; font-weight:700;
  box-shadow:0 4px 12px rgba(38,51,63,.28);
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
}
.brand-txt{min-width:0}
.brand h1{font-size:16.5px; font-weight:800; letter-spacing:-.02em; line-height:1.25}
.brand p{font-size:11.5px; color:var(--muted); letter-spacing:.02em; margin-top:1px}
.brand .tag{
  margin-left:auto; flex:0 0 auto;
  font-size:11px; font-weight:700; color:var(--indigo);
  background:var(--indigo-soft); border-radius:999px; padding:5px 9px;
  white-space:nowrap;
}

/* ---------- search ---------- */
.searchbox{position:relative; margin-top:10px}
.searchbox svg.ico{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--faint)}
.searchbox input{
  width:100%; padding:11px 42px 11px 38px;
  border:1px solid var(--line); border-radius:13px;
  background:var(--panel); color:var(--ink);
  font-size:15px; line-height:1.3;
  box-shadow:0 1px 1px rgba(34,33,42,.03);
  transition:border-color .15s, box-shadow .15s;
}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input:focus{
  outline:none; border-color:#c9b9a4;
  box-shadow:0 0 0 3px rgba(181,67,47,.10);
}
.searchbox .clear{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  color:var(--muted); font-size:16px; line-height:1;
}
.searchbox .clear:hover{background:var(--bg-soft)}

/* ---------- filter pills ---------- */
.pills{
  display:flex; gap:7px; align-items:center;
  overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  padding:9px 0 4px; margin:0 -16px; padding-left:16px; padding-right:16px;
}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto; padding:6px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel);
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  transition:background .15s, color .15s, border-color .15s;
  white-space:nowrap;
}
.pill:hover{border-color:#d6cbb8}
.pill[aria-pressed="true"]{
  background:var(--ink); border-color:var(--ink); color:#fff;
}
.pill.lv[data-level="N5"][aria-pressed="true"]{background:var(--n5); border-color:var(--n5)}
.pill.lv[data-level="N4"][aria-pressed="true"]{background:var(--n4); border-color:var(--n4)}
.pill.lv[data-level="N3"][aria-pressed="true"]{background:var(--n3); border-color:var(--n3)}
.pill.lv[data-level="N2"][aria-pressed="true"]{background:var(--n2); border-color:var(--n2)}
.pill.lv[data-level="N1"][aria-pressed="true"]{background:var(--n1); border-color:var(--n1)}
.pill.bm[aria-pressed="true"]{background:#8a6a17; border-color:#8a6a17; color:#fff}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex; align-items:center; gap:8px;
  padding:6px 16px 2px; max-width:700px; margin:0 auto;
}
.catwrap{position:relative; flex:1 1 auto; min-width:0}
.catwrap svg{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none}
select.cat{
  -webkit-appearance:none; appearance:none; width:100%;
  padding:7px 28px 7px 10px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel);
  font-size:12.5px; font-weight:600; color:var(--ink-2);
  text-overflow:ellipsis;
}
.count{flex:0 0 auto; font-size:11.5px; color:var(--muted); font-weight:600; white-space:nowrap}
.iconbtn{
  flex:0 0 auto; width:32px; height:32px; border-radius:10px;
  display:grid; place-items:center; border:1px solid var(--line); background:var(--panel);
  font-size:15px;
}
.iconbtn:hover{background:var(--bg-soft)}

/* ---------- dictionary list ---------- */
.view{max-width:700px; margin:0 auto; padding:0 0 24px}
.glist{display:grid; gap:8px; padding:10px 16px 0}
.gitem{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:11px 12px;
  transition:transform .12s ease, box-shadow .15s ease, border-color .15s;
  width:100%; text-align:left;
}
.gitem:hover{border-color:#d9cdb9; box-shadow:var(--shadow)}
.gitem:active{transform:scale(.995)}
.lv{
  flex:0 0 auto; min-width:30px; height:22px; padding:0 6px;
  border-radius:7px; display:inline-grid; place-items:center;
  font-size:11px; font-weight:800; letter-spacing:.02em;
}
.lv.N5{background:var(--n5-bg); color:var(--n5)}
.lv.N4{background:var(--n4-bg); color:var(--n4)}
.lv.N3{background:var(--n3-bg); color:var(--n3)}
.lv.N2{background:var(--n2-bg); color:var(--n2)}
.lv.N1{background:var(--n1-bg); color:var(--n1)}
.gitem .mid{flex:1 1 auto; min-width:0}
.gitem .ptn{font-size:16.5px; font-weight:700; letter-spacing:-.01em; line-height:1.35}
.gitem .mean{font-size:12.8px; color:var(--muted); margin-top:2px; line-height:1.45}
.gitem .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.tagchip{
  font-size:10.5px; font-weight:600; color:var(--ink-2);
  background:var(--bg-soft); border-radius:999px; padding:2px 7px;
}
.tagchip.soft{background:transparent; border:1px solid var(--line-2); color:var(--faint)}
.star{
  flex:0 0 auto; width:30px; height:30px; margin:-2px -4px 0 0;
  display:grid; place-items:center; border-radius:9px;
  color:#c9c1b1; font-size:16px; line-height:1;
}
.star:hover{background:var(--bg-soft)}
.star.on{color:#d19a1e}

.section-label{
  display:flex; align-items:center; gap:8px;
  padding:16px 16px 2px; font-size:12px; font-weight:800; color:var(--muted);
  letter-spacing:.04em;
}
.section-label::after{content:""; flex:1; height:1px; background:var(--line-2)}
.recent{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:8px 16px 2px}
.recent::-webkit-scrollbar{display:none}
.recent button{
  flex:0 0 auto; border:1px solid var(--line); background:var(--panel);
  border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600; color:var(--ink-2);
}
.empty{
  text-align:center; padding:48px 24px; color:var(--muted);
}
.empty .big{font-size:34px; margin-bottom:8px}
.empty p{font-size:13.5px; line-height:1.7}
.empty .hint{
  display:inline-block; margin-top:12px; font-size:12px; color:var(--ink-2);
  background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
}

/* ---------- level chip on dialog ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;
  background:var(--bg-soft); color:var(--ink-2);
}

/* ---------- modal sheet ---------- */
.sheet-back{
  position:fixed; inset:0; z-index:70;
  background:rgba(26,22,18,.44);
  display:flex; align-items:flex-end; justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes rise{from{transform:translateY(22px); opacity:.6} to{transform:translateY(0); opacity:1}}
.sheet{
  position:relative;
  width:100%; max-width:700px; max-height:93vh; max-height:93dvh;
  background:var(--panel);
  border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column;
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
  overflow:hidden;
  padding-bottom:var(--safe-b);
}
.sheet-head{
  position:sticky; top:0; z-index:2; flex:0 0 auto;
  background:linear-gradient(var(--panel) 82%, rgba(255,253,248,.9));
  border-bottom:1px solid var(--line-2);
  padding:14px 16px 11px;
}
.sheet-grab{width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 10px}
.sheet-top{display:flex; align-items:flex-start; gap:10px}
.sheet-top .mid{flex:1 1 auto; min-width:0}
.sheet-pattern{font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.25; margin-top:4px}
.sheet-reading{font-size:13px; color:var(--muted); margin-top:1px}
.closebtn{
  width:34px; height:34px; border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; background:var(--bg-soft); color:var(--muted);
  font-size:17px; line-height:1;
}
.closebtn:hover{background:var(--line)}
.sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 30px}
.ratebar{display:flex; align-items:center; gap:6px; margin-top:11px; flex-wrap:wrap}
.ratebtn{
  display:inline-flex; align-items:center; gap:5px;
  border:1px solid var(--line); background:var(--panel-2);
  border-radius:999px; padding:5px 11px; font-size:12px; font-weight:700; color:var(--ink-2);
}
.ratebtn:hover{border-color:#d6cbb8}
.ratebtn.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.ratebtn .sp{font-size:13px}

.formula{
  display:flex; align-items:flex-start; gap:9px;
  background:linear-gradient(180deg,#fdf6ee,#faf1e5);
  border:1px solid #f0e2cd; border-radius:13px;
  padding:10px 12px; margin-bottom:14px;
}
.formula .k{
  flex:0 0 auto; font-size:10.5px; font-weight:800; color:#9a6a28;
  letter-spacing:.06em; padding-top:2px;
}
.formula .v{font-size:14px; font-weight:700; color:#6c4a1d; line-height:1.5; word-break:keep-all}
.block{margin-bottom:16px}
.block .k{
  font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.06em;
  margin-bottom:5px; display:block;
}
.block .mean-line{font-size:16px; font-weight:700; letter-spacing:-.01em}
.block p.body{font-size:14px; line-height:1.8; color:var(--ink-2); word-break:keep-all}
.block p.body b{color:var(--ink); font-weight:700}

.togglebar{
  display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  margin:2px 0 10px;
}
.tgl{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:var(--panel-2); border-radius:999px;
  padding:5px 10px; font-size:11.5px; font-weight:700; color:var(--muted);
}
.tgl[aria-pressed="true"]{color:var(--ink); background:#fff; border-color:#d6cbb8}
.tgl .dot{width:7px; height:7px; border-radius:50%; background:#d9d2c4}
.tgl[aria-pressed="true"] .dot{background:var(--accent)}

.exlist{display:grid; gap:10px}
.ex{
  border:1px solid var(--line-2); background:#fffefb;
  border-radius:13px; padding:11px 12px;
}
.ex .jp-row{display:flex; align-items:flex-start; gap:8px}
.ex .jp{font-size:16px; font-weight:600; line-height:1.6; flex:1; letter-spacing:-.005em; word-break:keep-all}
.ex .rd{
  display:none; font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5;
}
.ex .ko{font-size:13px; color:var(--ink-2); margin-top:6px; line-height:1.6}
body.hide-ko .ex .ko{display:none}
body.show-rd .ex .rd{display:block}
.spk{
  flex:0 0 auto; width:30px; height:30px; border-radius:9px;
  display:grid; place-items:center; background:var(--bg-soft); color:var(--indigo);
  font-size:14px;
}
.spk:hover{background:var(--indigo-soft)}
.spk:active{transform:scale(.94)}

.similar{display:flex; flex-wrap:wrap; gap:7px}
.simchip{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:var(--panel-2);
  border-radius:11px; padding:7px 10px; font-size:13px; font-weight:600;
  max-width:100%;
}
.simchip:hover{border-color:#d6cbb8; background:#fff}
.simchip .lv{transform:scale(.92)}
.diffnote{
  font-size:12.5px; color:var(--muted); line-height:1.65;
  border-left:2px solid var(--line); padding-left:9px; margin-top:9px;
}
.actions-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:12px; padding:10px 14px; font-size:13.5px; font-weight:700;
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
}
.btn:hover{border-color:#d6cbb8}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.ghost{background:transparent}
.btn.blockbtn{width:100%}

/* ---------- tabs / compare ---------- */
.segment{
  display:flex; gap:4px; background:var(--bg-soft); border-radius:12px;
  padding:4px; margin:12px 16px 0;
}
.segment button{
  flex:1; border-radius:9px; padding:8px 6px; font-size:13px; font-weight:700;
  color:var(--muted);
}
.segment button[aria-selected="true"]{
  background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(34,33,42,.08);
}
.viewhead{padding:14px 16px 2px}
.viewhead h2{font-size:18px; font-weight:800; letter-spacing:-.02em}
.viewhead p{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.6}

.cmp-tools{display:grid; gap:8px; padding:12px 16px 0}

/* ---------- comparison search ---------- */
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-decoration{-webkit-appearance:none; appearance:none}
.cmpfilter{position:relative; margin:12px 16px 0}
.cmpfilter svg.ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint); pointer-events:none}
.cmpfilter input{
  width:100%; padding:10px 40px 10px 36px;
  border:1px solid var(--line); border-radius:12px;
  background:var(--panel); color:var(--ink); font-size:14px; line-height:1.3;
  box-shadow:0 1px 1px rgba(34,33,42,.03);
  transition:border-color .15s, box-shadow .15s;
}
.cmpfilter input::placeholder{color:var(--faint)}
.cmpfilter input:focus{
  outline:none; border-color:#c9b9a4;
  box-shadow:0 0 0 3px rgba(181,67,47,.10);
}
.cmpfilter .clear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  color:var(--muted); font-size:16px; line-height:1;
}
.cmpfilter .clear:hover{background:var(--bg-soft)}
.cmpmeta{
  display:flex; align-items:center; gap:8px; padding:7px 16px 0;
  font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.02em;
}
.cmpmeta .chipbtn{
  margin-left:auto; font-size:11px; font-weight:700; color:var(--indigo);
  background:var(--indigo-soft); border-radius:999px; padding:3px 9px;
}

/* ---------- A / B / C searchable picker ---------- */
.slot{display:flex; align-items:flex-start; gap:7px}
.slotlabel{
  flex:0 0 20px; padding-top:9px;
  font-size:12px; font-weight:800; color:var(--muted); text-align:center;
}
.slotbody{flex:1 1 auto; min-width:0}
.slotsearch{position:relative}
.slotsearch svg.ico{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--faint); pointer-events:none;
}
.slotsearch input{
  width:100%; padding:9px 32px 9px 31px;
  border:1px solid var(--line); border-radius:11px;
  background:var(--panel); font-size:14px; line-height:1.3;
}
.slotsearch input::placeholder{color:var(--faint); font-size:13px}
.slotsearch input:focus{
  outline:none; border-color:#c9b9a4;
  box-shadow:0 0 0 3px rgba(181,67,47,.10);
}
.slotsearch .clear{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  color:var(--muted); font-size:15px; line-height:1;
}
.slotlist{
  margin-top:6px; border:1px solid var(--line); border-radius:12px;
  background:var(--panel); overflow-y:auto; max-height:252px;
  box-shadow:var(--shadow);
}
.slotnote{
  padding:8px 10px; font-size:11px; font-weight:700; color:var(--faint);
  letter-spacing:.02em; background:var(--panel-2); border-bottom:1px solid var(--line-2);
}
.slotnote:last-child{border-bottom:0}
.slotopt{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:9px 10px; border-bottom:1px solid var(--line-2);
}
.slotopt:last-child{border-bottom:0}
.slotopt:hover,.slotopt:active{background:var(--bg-soft)}
.slotopt .mid{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px}
.slotopt .ptn{font-size:14px; font-weight:700; letter-spacing:-.01em; line-height:1.35; word-break:break-word}
.slotopt .mean{font-size:11.5px; color:var(--muted); line-height:1.4}
.slotopt .tagchip{flex:0 0 auto}
.slotchosen{
  display:flex; align-items:center; gap:7px;
  border:1px solid #d6cbb8; background:#fff;
  border-radius:12px; padding:7px 8px 7px 9px;
  box-shadow:0 1px 3px rgba(34,33,42,.05);
}
.slotchosen .slotmain{
  flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; text-align:left;
}
.slotchosen .ptn{font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.3; word-break:break-word}
.slotchosen .mean{font-size:11.5px; color:var(--muted); line-height:1.4; word-break:break-word}
.slotchosen .slotchg{
  flex:0 0 auto; font-size:11px; font-weight:700; color:var(--indigo);
  background:var(--indigo-soft); border-radius:999px; padding:4px 8px;
}
.slotchosen .slotx{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%;
  display:grid; place-items:center; color:var(--muted); font-size:15px; line-height:1;
}
.slotchosen .slotx:hover{background:var(--bg-soft)}
.slot .lv{align-self:center}
.cmp-list{display:grid; gap:10px; padding:10px 16px 0}
.cmp-card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  overflow:hidden;
}
.cmp-card > button.head{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:13px 13px;
}
.cmp-card .head .mid{flex:1; min-width:0}
.cmp-card .head .t{font-size:15.5px; font-weight:750; letter-spacing:-.01em; line-height:1.35}
.cmp-card .head .q{font-size:12px; color:var(--muted); margin-top:2px}
.cmp-card .head .chev{color:var(--faint); font-size:13px; transition:transform .18s}
.cmp-card.open .head .chev{transform:rotate(180deg)}
.cmp-body{display:none; padding:0 13px 14px; border-top:1px solid var(--line-2)}
.cmp-card.open .cmp-body{display:block; animation:fade .18s}
.cmp-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:10px; border-radius:12px; border:1px solid var(--line-2)}
table.cmp{
  border-collapse:separate; border-spacing:0; width:100%;
  min-width:calc(54px + var(--mcols) * 116px);
  font-size:12.5px;
}
table.cmp th, table.cmp td{
  padding:9px 9px; vertical-align:top; text-align:left;
  border-bottom:1px solid var(--line-2); border-right:1px solid var(--line-2);
  line-height:1.55;
}
table.cmp thead th{background:var(--panel-2); border-bottom:1px solid var(--line); vertical-align:middle}
table.cmp tr:last-child th, table.cmp tr:last-child td{border-bottom:0}
table.cmp th:last-child, table.cmp td:last-child{border-right:0}
table.cmp .rowh{
  position:sticky; left:0; z-index:1; width:54px; min-width:54px;
  background:var(--panel-2); font-size:10.5px; font-weight:800; color:var(--muted);
  letter-spacing:.02em;
}
table.cmp thead .rowh{background:#f4efe6}
.cmp-ptn{font-size:14.5px; font-weight:800; letter-spacing:-.01em; line-height:1.3; margin-top:3px; word-break:keep-all}
.cmp-open{
  margin-top:5px; font-size:11px; font-weight:700; color:var(--accent);
}
.cmp-ex{font-size:12.5px; line-height:1.55}
.cmp-ex .ko{color:var(--muted); font-size:11.5px; margin-top:3px}
.cmp-takeaway{
  margin-top:11px; font-size:12.5px; line-height:1.65; color:var(--ink-2);
  background:var(--indigo-soft); border-radius:11px; padding:9px 11px;
}
.cmp-takeaway b{color:var(--indigo)}
.hint-scroll{font-size:11px; color:var(--faint); margin-top:6px; display:none}
.cmp-scroll.is-scroll + .hint-scroll{display:block}

/* ---------- quiz ---------- */
.quiz-top{padding:12px 16px 0}
.quiz-intro{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:16px; margin:12px 16px 0; box-shadow:var(--shadow);
}
.quiz-intro h3{font-size:16px; font-weight:800; letter-spacing:-.02em}
.quiz-intro p{font-size:13px; color:var(--muted); margin-top:5px; line-height:1.7}
.stats{display:flex; gap:8px; margin-top:13px}
.stat{
  flex:1; background:var(--panel-2); border:1px solid var(--line-2);
  border-radius:12px; padding:9px 10px;
}
.stat .n{font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.2}
.stat .l{font-size:10.5px; color:var(--muted); font-weight:700; margin-top:1px}
.qcard{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  margin:12px 16px 0; padding:15px 14px 14px; box-shadow:var(--shadow);
}
.qhead{display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--muted)}
.qhead .qtype{background:var(--bg-soft); border-radius:999px; padding:3px 8px; color:var(--ink-2)}
.qhead .qcount{margin-left:auto; font-variant-numeric:tabular-nums}
.progress{height:4px; border-radius:99px; background:var(--bg-soft); margin-top:9px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s}
.qsent{
  font-size:20px; font-weight:700; line-height:1.65; letter-spacing:-.01em;
  margin:14px 0 4px; word-break:keep-all;
}
.qsent .blank{
  display:inline-block; min-width:52px; border-bottom:2px solid var(--accent);
  color:var(--accent); text-align:center; line-height:1.3;
}
.qsub{font-size:12.5px; color:var(--muted); line-height:1.6}
.opts{display:grid; gap:8px; margin-top:13px}
.opt{
  display:flex; align-items:center; gap:10px;
  border:1px solid var(--line); background:var(--panel-2);
  border-radius:12px; padding:11px 12px; text-align:left;
  font-size:14.5px; font-weight:600; line-height:1.5;
  transition:border-color .12s, background .12s, transform .1s;
  width:100%;
}
.opt:hover{border-color:#d6cbb8}
.opt:active{transform:scale(.995)}
.opt .idx{
  flex:0 0 22px; height:22px; border-radius:7px; background:#fff;
  border:1px solid var(--line); display:grid; place-items:center;
  font-size:11px; font-weight:800; color:var(--muted);
}
.opt.picked{border-color:var(--ink); background:#fff}
.opt.correct{border-color:var(--good); background:var(--good-soft)}
.opt.correct .idx{background:var(--good); border-color:var(--good); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .idx{background:var(--bad); border-color:var(--bad); color:#fff}
.opt:disabled{opacity:1}
.fb{
  margin-top:12px; border-radius:13px; padding:11px 12px;
  background:var(--indigo-soft); border:1px solid #d8e2ea;
  font-size:13px; line-height:1.7; color:var(--ink-2);
  animation:fade .2s;
}
.fb.bad{background:var(--bad-soft); border-color:#f1d3d3}
.fb .fbh{font-weight:800; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:6px}
.fb .ptn{font-weight:800; color:var(--ink)}
.fb .why{margin-top:5px}
.fb .act{margin-top:9px; display:flex; gap:7px; flex-wrap:wrap}
.fb .act button{
  font-size:12px; font-weight:700; color:var(--indigo);
  background:#fff; border:1px solid #d8e2ea; border-radius:999px; padding:5px 10px;
}
.qnav{display:flex; gap:8px; margin-top:13px}
.qnav .btn{flex:1}
.qresult{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  margin:12px 16px 0; padding:20px 16px; text-align:center; box-shadow:var(--shadow);
}
.qresult .score{font-size:38px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.qresult .score span{font-size:16px; color:var(--muted); font-weight:700}
.qresult .msg{font-size:13.5px; color:var(--ink-2); margin-top:6px; line-height:1.7}
.review{display:grid; gap:7px; margin-top:15px; text-align:left}
.review button{
  display:flex; align-items:center; gap:8px; width:100%;
  border:1px solid var(--line); background:var(--panel-2); border-radius:11px;
  padding:8px 10px; font-size:12.5px; font-weight:600; text-align:left;
}
.review .ok{color:var(--good); font-weight:800}
.review .ng{color:var(--bad); font-weight:800}

/* ---------- top tab bar (사전 · 비교 · 퀴즈) ---------- */
.appbar-top{display:block}
.topnav{margin-top:10px}
.topnav-in{
  display:flex; gap:4px; padding:4px;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:14px;
}
.tab{
  flex:1 1 0; min-width:0;
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 4px; min-height:40px; border-radius:11px;
  font-size:13px; font-weight:700; color:var(--muted); letter-spacing:-.01em;
  transition:background .15s, color .15s, box-shadow .15s;
}
.tab .ic{font-size:15px; line-height:1; filter:grayscale(1) opacity(.5); transition:filter .15s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{
  background:var(--panel); color:var(--ink);
  box-shadow:0 1px 2px rgba(34,33,42,.10), 0 2px 7px rgba(34,33,42,.06);
}
.tab[aria-selected="true"] .ic{filter:none}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translate(-50%,10px);
  background:#26232b; color:#fff; font-size:12.5px; font-weight:600;
  padding:9px 14px; border-radius:999px; z-index:90;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  max-width:calc(100% - 40px); text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.24);
}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- desktop tweaks ---------- */
@media (min-width:720px){
  body{font-size:15.5px}
  .appbar-in{padding:13px 20px 10px}
  .appbar-top{display:flex; align-items:center; gap:20px}
  .appbar-top .brand{flex:1 1 auto; min-width:0}
  .topnav{margin-top:0; flex:0 0 330px}
  .tab{min-height:38px; font-size:13.5px}
  .brand h1{font-size:18px}
  .pills{margin:0; padding:9px 0 4px}
  .toolbar{padding:6px 0 0}
  .view{padding-bottom:16px}
  .glist{padding:10px 0 0}
  .viewhead{padding-left:0; padding-right:0}
  .segment{margin-left:0; margin-right:0}
  .cmp-list{padding-left:0; padding-right:0}
  .cmp-tools{padding-left:0; padding-right:0}
  .cmpfilter{margin-left:0; margin-right:0}
  .cmpmeta{padding-left:0; padding-right:0}
  .quiz-intro, .qcard, .qresult{margin-left:0; margin-right:0}
  .sheet{border-radius:22px; margin-bottom:4vh; max-height:88vh}
  .sheet-head{padding:18px 20px 12px}
  .sheet-body{padding:16px 20px 30px}
  .sheet-grab{display:none}
  .gitem .ptn{font-size:17.5px}
  .appbar{position:sticky}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
}


/* ---------- tab-specific chrome ---------- */
body:not(.tab-dict) .searchbox,
body:not(.tab-dict) #levelPills{display:none}
body:not(.tab-dict) .appbar-in{padding-bottom:11px}

.cmp-scroll.is-scroll{
  -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 16px), transparent 100%);
          mask-image:linear-gradient(to right, #000 calc(100% - 16px), transparent 100%);
}

<body>

<header class="appbar">

  <!-- ================= 비교 ================= -->
  <section id="view-cmp" class="view" aria-label="문법 비교" hidden>

        <p id="cmpEmptyMsg">맞는 비교 세트를 찾지 못했어요.</p>
        <span class="hint">힌트: そうだ · ばかり · 이유 · 추측</span>

    <div id="cmpCustom" hidden>

              <input class="slotinput" id="cmpQA" data-slotinput="0" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"

              <button class="clear" data-slotqueryclear="0" aria-label="A 검색어 지우기" hidden>&times;</button>

              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
              <input class="slotinput" id="cmpQB" data-slotinput="1" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"

              <button class="clear" data-slotqueryclear="1" aria-label="B 검색어 지우기" hidden>&times;</button>

            <div class="slotchosen" id="cmpCB" hidden></div>

              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
              <input class="slotinput" id="cmpQC" data-slotinput="2" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"

              <button class="clear" data-slotqueryclear="2" aria-label="C 검색어 지우기" hidden>&times;</button>

        </div>
      </div>
      <div id="cmpCustomResult" class="cmp-list"></div>
    </div>
  </section>

  <section id="view-quiz" class="view" aria-label="복습 퀴즈" hidden>
    <div class="viewhead">

<div id="modalRoot"></div>

, 무엇이 다를까?","members":[{"gid":"n5-wa","point":"이미 아는 화제를 꺼내 그에 대해 설명","example":{"jp":"私は学生です。","ko":"저는 학생입니다."}},{"gid":"n5-ga","point":"처음 나오는 정보·질문의 초점을 표시","example":{"jp":"だれが来ましたか。","ko":"누가 왔습니까?"}}],"takeaway":"이미 알려진 것은 は, 새 정보·답의 초점은 が."},{"id":"cmp-ni-de","level":"N5","title":"に vs で","question":"같은 '~에서'인데 왜 다를까?","members":[{"gid":"n5-ni","point":"존재하는 장소·도착점·시각","example":{"jp":"駅に着きました。","ko":"역에 도착했습니다."}},{"gid":"n5-de","point":"행위가 벌어지는 장소·수단","example":{"jp":"駅で待っています。","ko":"역에서 기다리고 있습니다."}}],"takeaway":"도착·존재는 に, 행위의 무대는 で."},{"id":"cmp-te-miru-oku-shimau","level":"N4","title":"てみる vs ておく vs てしまう","question":"'~해 보다·해 두다·해 버리다'의 차이","members":[{"gid":"n4-te-miru","point":"결과를 모른 채 시험 삼아 해 봄","example":{"jp":"この靴を履いてみてもいいですか。","ko":"이 신발을 신어 봐도 됩니까?"}},{"gid":"n4-te-oku","point":"다음을 위해 미리 준비해 둠","example":{"jp":"会議の資料をコピーしておきます。","ko":"회의 자료를 복사해 둡니다."}},{"gid":"n4-te-shimau","point":"완전히 끝냄, 후회·아쉬움","example":{"jp":"資料を全部コピーしてしまいました。","ko":"자료를 전부 복사해 버렸습니다."}}],"takeaway":"시도=てみる, 준비=ておく, 완료·후회=てしまう."},{"id":"cmp-sou-you-rashii","level":"N4","title":"そうだ(양태) vs そうだ(전문) vs ようだ vs らしい","question":"'~인 것 같다' 네 가지, 접속이 열쇠","members":[{"gid":"n4-sou-da-youtai","point":"눈앞의 인상에서 판단 (어간+そう)","example":{"jp":"この料理はおいしそうです。","ko":"이 요리는 맛있어 보입니다."}},{"gid":"n4-sou-da-denshou","point":"들은 정보의 전달 (보통형+そう)","example":{"jp":"この店はおいしいそうです。","ko":"이 가게는 맛있다고 합니다."}},{"gid":"n4-you-da","point":"상황 근거로 판단, 문어적","example":{"jp":"この店はおいしいようだ。","ko":"이 가게는 맛있는 것 같다."}},{"gid":"n4-rashii","point":"간접 정보·'~다운' 전형성","example":{"jp":"この店はおいしいらしい。","ko":"이 가게는 맛있다더라."}}],"takeaway":"おいし+そう(인상) / おいしい+そう(전문) — 앞 형태를 먼저 보세요."},{"id":"cmp-kara-node-tame","level":"N4","title":"から vs ので vs ために","question":"이유와 목적을 구분하기","members":[{"gid":"n5-kara","point":"주관적 이유, 문장 끝 이유, 시작점","example":{"jp":"寒いから、窓を閉めます。","ko":"추우니까 창을 닫습니다."}},{"gid":"n5-node","point":"객관적이고 부드러운 이유","example":{"jp":"寒いので、窓を閉めます。","ko":"추워서 창을 닫습니다."}},{"gid":"n4-tameni","point":"의지적 목표를 위한 목적","example":{"jp":"寒さを防ぐために、窓を閉めます。","ko":"추위를 막기 위해 창을 닫습니다."}}],"takeaway":"목적은 ために, 이유는 から(주관)·ので(객관)."},{"id":"cmp-nagara-aida-uchi","level":"N4","title":"ながら vs あいだ(に) vs うちに","question":"'~하는 동안'의 시간 폭과 뉘앙스","members":[{"gid":"n5-nagara","point":"같은 주어의 두 동작을 동시에","example":{"jp":"音楽を聞きながら歩く。","ko":"음악을 들으면서 걷는다."}},{"gid":"n4-aida","point":"그 기간 전체에 걸쳐 계속","example":{"jp":"私が料理しているあいだ、彼はテレビを見ていた。","ko":"내가 요리하는 동안 그는 TV를 보고 있었다."}},{"gid":"n4-aida-ni","point":"기간 중 어느 한 시점에","example":{"jp":"私が料理しているあいだに、彼は出かけた。","ko":"내가 요리하는 사이에 그는 나갔다."}},{"gid":"n4-uchi-ni","point":"상태가 바뀌기 전에 (기회)","example":{"jp":"温かいうちに食べてください。","ko":"따뜻할 때 드세요."}}],"takeaway":"동시 동작=ながら, 기간 전체=あいだ, 한 시점=あいだに, 변화 전=うちに."},{"id":"cmp-wake-dewa-nai-kagiranai-hazu","level":"N3","title":"わけではない vs とは限らない vs はずがない","question":"'~은 아니다'를 어디까지 부정하나","members":[{"gid":"n3-wake-dewa-nai","point":"전체가 아니라 일부만 부정","example":{"jp":"嫌いなわけではない。","ko":"싫어하는 것은 아니다."}},{"gid":"n3-to-wa-kagiranai","point":"일반론에도 예외가 있다","example":{"jp":"高いものがいいとは限らない。","ko":"비싼 것이 좋다고는 할 수 없다."}},{"gid":"n3-hazu-ga-nai","point":"근거를 바탕으로 가능성 전면 부정","example":{"jp":"彼が来るはずがない。","ko":"그가 올 리가 없다."}}],"takeaway":"부분 부정=わけではない, 예외=とは限らない, 전면 부정=はずがない."},{"id":"cmp-bakari-dake-shika","level":"N4","title":"ばかり vs だけ vs しか","question":"'~만'의 세 가지 얼굴","members":[{"gid":"n4-bakari","point":"같은 것만 반복·편향, 또는 직후","example":{"jp":"彼は文句ばかり言う。","ko":"그는 불평만 한다."}},{"gid":"n4-dake","point":"중립적으로 범위를 한정","example":{"jp":"水だけください。","ko":"물만 주세요."}},{"gid":"n4-shika","point":"부정문과 짝을 이뤄 '밖에 없다'","example":{"jp":"水しかない。","ko":"물밖에 없다."}}],"takeaway":"편향=ばかり, 중립 한정=だけ, 부정 한정=しか+부정."},{"id":"cmp-mokakawarazu-noni-mono-no","level":"N2","title":"にもかかわらず vs のに vs ものの","question":"역접의 온도 차이","members":[{"gid":"n2-ni-mokakawarazu","point":"격식 있고 강한 '~에도 불구하고'","example":{"jp":"雨にもかかわらず、試合は行われた。","ko":"비에도 불구하고 경기는 열렸다."}},{"gid":"n4-noni","point":"기대와 다른 결과에 대한 불만·아쉬움","example":{"jp":"一生懸命勉強したのに、落ちた。","ko":"열심히 공부했는데도 떨어졌다."}},{"gid":"n3-mono-no","point":"인정은 하지만 담담하게 반전","example":{"jp":"免許は取ったものの、車がない。","ko":"면허는 땄지만 차가 없다."}}],"takeaway":"강한 격식=にもかかわらず, 감정=のに, 담담=ものの."},{"id":"cmp-zaru-wake-hoka","level":"N2","title":"ざるを得ない vs ないわけにはいかない vs ほかない","question":"'~할 수밖에 없다'의 이유가 다르다","members":[{"gid":"n2-zaru-wo-enai","point":"상황상 불가항력, 체념","example":{"jp":"バスがないので、歩かざるを得ない。","ko":"버스가 없어 걸을 수밖에 없다."}},{"gid":"n1-nai-wake-niwa-ikanai","point":"사회적·도의적 의무","example":{"jp":"お世話になったので、お礼を言わないわけにはいかない。","ko":"신세를 졌으니 인사하지 않을 수 없다."}},{"gid":"n1-hoka-naranai","point":"다른 수단이 전혀 없음","example":{"jp":"だれもいないので、自分でやるほかない。","ko":"아무도 없으니 내가 할 수밖에 없다."}}],"takeaway":"상황=ざるを得ない, 의무=ないわけにはいかない, 소거=ほかない."},{"id":"cmp-tara-ba-nara-to","level":"N4","title":"たら vs ば vs なら vs と","question":"조건 표현 네 가지 고르기","members":[{"gid":"n4-tara","point":"가장 폭넓은 조건·발견·계기","example":{"jp":"駅に着いたら、電話してください。","ko":"역에 도착하면 전화해 주세요."}},{"gid":"n4-ba","point":"논리적 조건, '~하면 ~할수록'","example":{"jp":"安ければ買います。","ko":"싸면 사겠습니다."}},{"gid":"n4-nara","point":"상대의 말을 전제로 한 조언","example":{"jp":"日本に行くなら、京都がおすすめです。","ko":"일본에 간다면 교토를 추천합니다."}},{"gid":"n4-to-jouken","point":"반복·필연의 결과 (뒤에 의지·명령 불가)","example":{"jp":"春になると、桜が咲きます。","ko":"봄이 되면 벚꽃이 핍니다."}}],"takeaway":"迷ったら たら. 반복·기계적 결과는 と, 전제 조언은 なら."},{"id":"cmp-ageru-kureru-morau","level":"N5","title":"てあげる vs てくれる vs てもらう","question":"은혜의 방향을 그림으로 그려 보기","members":[{"gid":"n5-teageru","point":"내가(내 편이) 남에게 해 줌","example":{"jp":"友だちに本を貸してあげた。","ko":"친구에게 책을 빌려 줬다."}},{"gid":"n5-tekureru","point":"남이 나에게 해 줌","example":{"jp":"友だちが本を貸してくれた。","ko":"친구가 책을 빌려 줬다."}},{"gid":"n5-temorau","point":"내가 부탁해서 해 받음","example":{"jp":"友だちに本を貸してもらった。","ko":"친구에게 책을 빌려 받았다."}}],"takeaway":"주어가 '나'면 あげる, 상대가 주어면 くれる, 받는 쪽이 주어면 もらう."},{"id":"cmp-te-aru-teiru-teoku","level":"N4","title":"てある vs ている vs ておく","question":"조사 が/を로 갈리는 상태 표현","members":[{"gid":"n4-te-aru","point":"누군가 한 결과가 남은 상태 (が)","example":{"jp":"窓が開けてある。","ko":"창이 열려 있다."}},{"gid":"n5-teiru","point":"진행 중이거나 자연스러운 상태 (が)","example":{"jp":"窓が開いている。","ko":"창이 열려 있다."}},{"gid":"n4-te-oku","point":"다음을 위한 준비 행동 (を)","example":{"jp":"窓を開けておく。","ko":"창을 열어 둔다."}}],"takeaway":"결과 상태=が+てある, 진행=が+ている, 준비 행동=を+ておく."},{"id":"cmp-sou-ppoi-ge-gimi","level":"N3","title":"そうだ(양태) vs っぽい vs げ vs 気味","question":"'~해 보인다'의 결이 다르다","members":[{"gid":"n4-sou-da-youtai","point":"눈앞의 인상","example":{"jp":"彼は嬉しそうです。","ko":"그는 기뻐 보입니다."}},{"gid":"n3-ppoi","point":"그런 성질이 짙음","example":{"jp":"彼は子供っぽい。","ko":"그는 아이 같다."}},{"gid":"n3-ge","point":"겉으로 드러나는 표정·기색","example":{"jp":"彼は寂しげな顔をしている。","ko":"그는 쓸쓸한 기색이다."}},{"gid":"n3-gimi","point":"좋지 않은 상태가 약간","example":{"jp":"最近、疲れ気味だ。","ko":"요즘 피곤한 기미다."}}],"takeaway":"인상=そうだ, 성질=っぽい, 표정=げ, 약한 정도=気味."},{"id":"cmp-you-ni-tame-ni","level":"N4","title":"ように vs ために","question":"'~하기 위해'인데 동사가 다르다","members":[{"gid":"n4-you-ni","point":"가능형·비의지 동사(分かる·見える)와","example":{"jp":"忘れないように、メモします。","ko":"잊지 않도록 메모합니다."}},{"gid":"n4-tameni","point":"의지 동사·명사와","example":{"jp":"日本で働くために、日本語を勉強しています。","ko":"일본에서 일하기 위해 일본어를 공부하고 있습니다."}}],"takeaway":"의지 동사=ために, 가능·상태 동사=ように."},{"id":"cmp-you-ni-naru-suru","level":"N4","title":"ようになる vs ようにする","question":"자연스러운 변화 vs 의도적 노력","members":[{"gid":"n4-you-ni-naru","point":"결과적으로 할 수 있게 됨","example":{"jp":"日本語が話せるようになった。","ko":"일본어를 말할 수 있게 되었다."}},{"gid":"n4-you-ni-suru","point":"의식적으로 노력하는 습관","example":{"jp":"毎日話すようにしている。","ko":"매일 말하도록 하고 있다."}}],"takeaway":"변화=ようになる, 노력=ようにする."},{"id":"cmp-koto-ni-suru-naru","level":"N4","title":"ことにする vs ことになる","question":"누가 결정했나","members":[{"gid":"n4-koto-ni-suru","point":"내가 스스로 결정","example":{"jp":"来年、日本へ行くことにした。","ko":"내년에 일본에 가기로 했다."}},{"gid":"n4-koto-ni-naru","point":"외부에서 정해진 결과","example":{"jp":"来月、大阪へ転勤することになった。","ko":"다음 달 오사카로 전근하게 되었다."}}],"takeaway":"자기 결정=ことにする, 정해진 결과=ことになる."},{"id":"cmp-tsutsu-nagara-nagaramo","level":"N3","title":"つつ vs ながら vs ながらも","question":"동시인가, 역접인가","members":[{"gid":"n3-tsutsu","point":"문어적 동시 동작","example":{"jp":"将来を考えつつ、進路を決めた。","ko":"장래를 생각하면서 진로를 정했다."}},{"gid":"n5-nagara","point":"회화적 동시 동작","example":{"jp":"音楽を聞きながら勉強する。","ko":"음악을 들으면서 공부한다."}},{"gid":"n3-nagara-mo","point":"~이면서도 (역접)","example":{"jp":"狭いながらも、自分の部屋がほしい。","ko":"좁지만 내 방이 갖고 싶다."}}],"takeaway":"문어=つつ, 회화=ながら, 앞에 반대가 오면 ながらも."},{"id":"cmp-okage-sei-monodakara","level":"N3","title":"おかげで vs せいで vs ものだから","question":"좋은 결과, 나쁜 결과, 변명","members":[{"gid":"n3-okage-de","point":"좋은 결과의 원인 (감사)","example":{"jp":"先生のおかげで合格した。","ko":"선생님 덕분에 합격했다."}},{"gid":"n3-sei-de","point":"나쁜 결과의 원인 (탓)","example":{"jp":"寝坊したせいで遅れた。","ko":"늦잠 잔 탓에 늦었다."}},{"gid":"n3-mono-dakara","point":"변명조의 이유","example":{"jp":"雨が降っているものだから、タクシーで来た。","ko":"비가 오는 바람에 택시로 왔다."}}],"takeaway":"좋으면 おかげで, 나쁘면 せいで, 변명은 ものだから."},{"id":"cmp-nishitewa-wari-dake","level":"N3","title":"にしては vs わりに vs だけあって vs だけに","question":"'~에 비해'의 네 가지 평가","members":[{"gid":"n3-ni-shite-wa","point":"기준에서 예상되는 것과 다름","example":{"jp":"子供にしては、よく知っている。","ko":"아이치고는 잘 안다."}},{"gid":"n3-wari-ni","point":"비율·정도에 비해 의외","example":{"jp":"値段のわりに、おいしい。","ko":"가격에 비해 맛있다."}},{"gid":"n3-dake-atte","point":"자격·명성에 걸맞은 결과 (긍정)","example":{"jp":"プロだけあって、仕事が早い。","ko":"프로인 만큼 일이 빠르다."}},{"gid":"n3-dake-ni","point":"그 조건이라 더 강하게 느껴짐","example":{"jp":"期待していただけに、がっかりした。","ko":"기대했던 만큼 실망했다."}}],"takeaway":"의외=にしては·わりに, 걸맞음=だけあって, 감정 증폭=だけに."},{"id":"cmp-dokoroka-oroka-dokorodewanai","level":"N2","title":"どころか vs はおろか vs どころではない","question":"'커녕'과 '할 상황이 아니다'","members":[{"gid":"n3-dokoro-ka","point":"앞을 부정하고 반대 극단으로","example":{"jp":"漢字どころか、ひらがなも書けない。","ko":"한자는커녕 히라가나도 못 쓴다."}},{"gid":"n2-wa-oroka","point":"당연히 되어야 할 것조차 안 됨","example":{"jp":"旅行はおろか、外出もできない。","ko":"여행은커녕 외출도 못 한다."}},{"gid":"n2-dokoro-dewa-nai","point":"그 일을 할 여유·상황이 아님","example":{"jp":"忙しくて、旅行どころではない。","ko":"바빠서 여행할 상황이 아니다."}}],"takeaway":"どころか·はおろか은 대조, どころではない는 여유 없음."},{"id":"cmp-dakedenaku-bakarika-mochiron","level":"N3","title":"だけでなく vs ばかりか vs はもちろん vs のみならず","question":"'~뿐만 아니라'의 강도와 격식","members":[{"gid":"n3-dake-dewa-naku","point":"단순히 다른 것도 추가","example":{"jp":"学生だけでなく、先生も参加した。       if (s.stats && typeof s.stats === 'object') {
        base.stats.answered = Number(s.stats.answered) || 0;
        base.stats.correct = Number(s.stats.correct) || 0;
      }
    } catch (err) { /* private mode or bad data */ }
    return base;
  }
  function saveStore() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        bookmarks: store.bookmarks,
        recent: store.recent,
        stats: store.stats
      }));
    } catch (err) { /* ignore quota / private mode */ }
  }
  function isStarred(id) { return store.bookmarks.indexOf(id) !== -1; }
  function toggleStar(id) {
    var i = store.bookmarks.indexOf(id);
    if (i === -1) { store.bookmarks.push(id); toast('⭐ 북마크에 담았어요'); }
    else { store.bookmarks.splice(i, 1); toast('북마크에서 뺐어요'); }
    saveStore();
    renderList();
    renderPills();
    renderModalStar();
    renderQuizAll();
  }
  function addRecent(id) {

    if (i !== -1) store.recent.splice(i, 1);
    store.recent.unshift(id);

  /* ---------------- text helpers ---------------- */
  function toHira(s) {
    return String(s == null ? '' : s).replace(/[\u30a1-\u30f6]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0x60);
    });
  }
  function norm(s) {
    var t = toHira(s);
    try { t = t.normalize('NFKC'); } catch (e) { /* older webview */ }
    return t.toLowerCase().replace(/[\s\u3000〜~ー・、。，,.\-—–_/\\()（）「」『』【】:：;；!?！？"'’“”+*＝=]/g, '');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function levelLabel(lv) { return '<span class="lv ' + lv + '">' + lv + '</span>'; }

  /* ---------------- search & filter ---------------- */
  function basePool() {
    return ENTRIES.filter(function (e) {
      if (state.level !== 'all' && e.level !== state.level) return false;
      if (state.starOnly && !isStarred(e.id)) return false;
      if (state.cat !== 'all' && e.category !== state.cat) return false;
      return true;
    });
  }
  function searchEntries(query, pool) {
    var src = pool || ENTRIES;
    var raw = String(query == null ? '' : query).trim();
    if (!raw) return src.slice();
    var tokens = raw.split(/\s+/).map(norm).filter(function (t) { return t.length > 0; });
    if (!tokens.length) return src.slice();

    var hits = [];
    for (var i = 0; i < src.length; i++) {
      var e = src[i];
      var score = 0;
      var matchedAll = true;
      for (var t = 0; t < tokens.length; t++) {
        var tok = tokens[t];
        if (e._hay.indexOf(tok) === -1) { matchedAll = false; break; }
        var pat = norm(e.pattern), rd = norm(e.reading), rm = norm(e.romaji);
        if (pat === tok) score += 100;
        else if (pat.indexOf(tok) !== -1) score += 45;
        if (rd === tok) score += 80;
        else if (rd.indexOf(tok) !== -1) score += 25;
        if (rm === tok) score += 60;
        else if (rm.indexOf(tok) !== -1) score += 20;
        if (norm(e.meaning).indexOf(tok) !== -1) score += 12;
        if (norm(e.category).indexOf(tok) !== -1) score += 8;
        score += 1;
      }
      if (matchedAll) hits.push({ e: e, s: score, i: i });
    }
    hits.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      return a.i - b.i;
    });
    return hits.map(function (h) { return h.e; });
  }
  function filteredEntries() { return searchEntries(state.q, basePool()); }

  /* ---------------- tts ---------------- */
  function speak(text, rate) {
    if (!text) return;
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance === 'undefined') {
      toast('이 브라우저에서는 음성 재생을 지원하지 않아요');
      return;
    }
    try {
      var synth = window.speechSynthesis;
      try { synth.cancel(); } catch (e) { /* noop */ }
      var u = new window.SpeechSynthesisUtterance(String(text));
      u.lang = 'ja-JP';
      u.rate = rate || state.rate || 1;
      try {
        var voices = synth.getVoices ? synth.getVoices() : [];
        for (var i = 0; i < voices.length; i++) {
          if (voices[i] && /^ja/i.test(voices[i].lang || '')) { u.voice = voices[i]; break; }
        }
      } catch (e2) { /* noop */ }
      synth.speak(u);
    } catch (err) {
      toast('음성을 재생할 수 없어요');
    }
  }

  /* ----- curated set search (33 sets) ----- */
  function cmpHay(g) {
    var parts = [g.title, g.question, g.takeaway, g.level];
    (g.members || []).forEach(function (m) {
      parts.push(m.point || '');
      var e = byId[m.gid];
      if (e) parts.push(e.pattern, e.reading, e.romaji, e.meaning, e.category);
    });
    return norm(parts.join(' '));
  }

  function searchComparisons(query) {
    var raw = String(query == null ? '' : query).trim();
    if (!raw) return CMP.slice();
    var tokens = raw.split(/\s+/).map(norm).filter(function (t) { return t.length > 0; });
    if (!tokens.length) return CMP.slice();
    var hits = [];
    for (var i = 0; i < CMP.length; i++) {
      var g = CMP[i];
      var hay = g._hay || cmpHay(g);
      g._hay = hay;
      var score = 0;
      var matchedAll = true;
      for (var t = 0; t < tokens.length; t++) {
        var tok = tokens[t];
        if (hay.indexOf(tok) === -1) { matchedAll = false; break; }
        var exactPat = false;
        var patHit = false;
        var meanHit = false;
        (g.members || []).forEach(function (m) {
          var e = byId[m.gid];
          if (!e) return;
          var p = norm(e.pattern);
          if (p === tok) exactPat = true;
          else if (p.indexOf(tok) !== -1) patHit = true;
          if (norm(e.meaning).indexOf(tok) !== -1) meanHit = true;
        });
        if (exactPat) score += 100;
        else if (patHit) score += 45;
        if (norm(g.title).indexOf(tok) !== -1) score += 40;
        if (norm(g.question).indexOf(tok) !== -1) score += 20;
        if (norm(g.takeaway).indexOf(tok) !== -1) score += 10;
        if (meanHit) score += 12;
        score += 1;
      }
      if (matchedAll) hits.push({ g: g, s: score, i: i });
    }
    hits.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      return a.i - b.i;
    });
    return hits.map(function (h) { return h.g; });
  }

  function cmpCardHtml(g) {

    return '<div class="cmp-card ' + (open ? 'open' : '') + '" data-cmp="' + g.id + '">' +

      '</div>' +
    '</div>';
  }

  /* ----- searchable A / B / C picker ----- */
  var SLOT_LETTERS = ['A', 'B', 'C'];
  var SLOT_PICK_MAX = 8;

  function slotUsedBy(id, except) {
    for (var i = 0; i < 3; i++) {
      if (i !== except && state.cmpPick[i] === id) return SLOT_LETTERS[i];
    }
    return '';
  }

  function slotEditable(i) { return state.cmpEdit[i] || !byId[state.cmpPick[i]]; }

  function renderSlotList(i) {
    var box = document.getElementById('cmpL' + SLOT_LETTERS[i]);
    if (!box) return;
    if (!slotEditable(i) || i !== state.cmpActive) { box.hidden = true; box.innerHTML = ''; return; }

    var q = String(state.cmpQ[i] || '').trim();
    var rows;
    var headTxt;
    if (!q) {
      rows = SLOT_QUICK.filter(function (id) { return !!byId[id]; }).map(function (id) {
        return { e: byId[id] };
      });

      headTxt = '검색 결과 ' + all.length + '개' + (all.length > SLOT_PICK_MAX ? ' · 상위 ' + SLOT_PICK_MAX + '개' : '');

  /* ---------------- quiz ---------------- */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function quizPool(filter) {
    if (filter === 'star') return ENTRIES.filter(function (e) { return isStarred(e.id); });
    if (filter === 'all') return ENTRIES.slice();
    return ENTRIES.filter(function (e) { return e.level === filter; });
  }

  function meaningOptions(entry, pool) {
    var opts = [entry.meaning];
    var seen = {};
    seen[norm(entry.meaning)] = true;
    var same = shuffle(pool.filter(function (e) { return e.id !== entry.id && e.level === entry.level; }));
    var others = shuffle(pool.filter(function (e) { return e.id !== entry.id && e.level !== entry.level; }));
    var cand = same.concat(others);
    for (var i = 0; i < cand.length && opts.length < 4; i++) {
      var m = cand[i].meaning;
      if (seen[norm(m)]) continue;
      seen[norm(m)] = true;
      opts.push(m);
    }
    return shuffle(opts);
  }

  function blankOptions(q, entry) {
    var opts = [q.answer];
    var seen = {};
    seen[norm(q.answer)] = true;
    var others = shuffle(QUIZBANK.filter(function (x) { return x.gid !== entry.id; }));
    var sameLevel = others.filter(function (x) { return byId[x.gid] && byId[x.gid].level === entry.level; });
    var rest = others.filter(function (x) { return !(byId[x.gid] && byId[x.gid].level === entry.level); });
    var cand = sameLevel.concat(rest);
    for (var i = 0; i < cand.length && opts.length < 4; i++) {
      if (!byId[cand[i].gid]) continue;
      if (seen[norm(cand[i].answer)]) continue;
      seen[norm(cand[i].answer)] = true;
      opts.push(cand[i].answer);
    }
    var fillers = ['という', 'ながら', 'ために', 'ばかり'];
    for (var k = 0; k < fillers.length && opts.length < 4; k++) {
      if (!seen[norm(fillers[k])]) { opts.push(fillers[k]); seen[norm(fillers[k])] = true; }
    }
    return shuffle(opts);
  }

  function buildQuiz(filter) {
    var pool = quizPool(filter || state.quizFilter);
    if (pool.length < 4) return { error: 'need-more', pool: pool };
    var meanSrc = shuffle(pool).slice(0, 5);
    var blanks = shuffle(QUIZBANK.filter(function (q) {
      return pool.some(function (e) { return e.id === q.gid; });
    })).slice(0, 5);

    var items = [];
    var maxLen = Math.max(meanSrc.length, blanks.length);
    for (var i = 0; i < maxLen; i++) {
      if (meanSrc[i]) {
        var e1 = meanSrc[i];
        var mo = meaningOptions(e1, pool);
        items.push({
          type: 'meaning',
          entryId: e1.id,
          prompt: e1.pattern,
          sub: '이 문법의 뜻으로 가장 알맞은 것은?',
          options: mo.map(function (text) { return { text: text, ok: text === e1.meaning }; }),
          why: e1.meaning + ' — ' + e1.nuance
        });
      }
      if (blanks[i]) {
        var q = blanks[i];
        var e2 = byId[q.gid];
        if (!e2) continue;
        var bo = blankOptions(q, e2);
        items.push({
          type: 'blank',
          entryId: e2.id,
          prompt: q.jp,
          sub: '빈칸에 들어갈 문법으로 가장 알맞은 것은?',
          ko: q.ko,
          answer: q.answer,
          options: bo.map(function (text) { return { text: text, ok: text === q.answer }; }),
          why: e2.pattern + ' — ' + e2.meaning + '. ' + e2.nuance
        });
      }
    }
    items = items.slice(0, 10).map(function (it) {
      var correct = 0;
      it.options.forEach(function (o, idx) { if (o.ok) correct = idx; });
      return { type: it.type, entryId: it.entryId, prompt: it.prompt, sub: it.sub, ko: it.ko, options: it.options, correct: correct, why: it.why };
    });
    return { items: items, filter: filter, idx: 0, picked: null, answered: false, correctCount: 0, done: false, log: [] };
  }

  function renderQuizPills() {
    var wrap = document.getElementById('quizPills');
    var html = '<button class="pill" data-qlevel="all" aria-pressed="' + (state.quizFilter === 'all') + '">전체</button>';
    LEVELS.forEach(function (lv) {
      html += '<button class="pill lv" data-qlevel="' + lv + '" aria-pressed="' + (state.quizFilter === lv) + '">' + lv + '</button>';
    });
    html += '<button class="pill bm" data-qlevel="star" aria-pressed="' + (state.quizFilter === 'star') + '">⭐ 북마크</button>';
    wrap.innerHTML = html;
  }

  function quizIntroHtml() {
    var pool = quizPool(state.quizFilter);
    var stats = store.stats;
    var rate = stats.answered ? Math.round(stats.correct / stats.answered * 100) : 0;
    var filterLabel = state.quizFilter === 'all' ? '전체 레벨' : (state.quizFilter === 'star' ? '북마크한 문법' : state.quizFilter);
    return '<div class="quiz-intro">' +
      '<h3>' + esc(filterLabel) + '로 10문제</h3>' +
      '<p>뜻 고르기 5문제와 빈칸 채우기 5문제가 번갈아 나와요. 틀린 문제는 바로 해설로 확인할 수 있습니다.</p>' +
      '<div class="stats">' +
        '<div class="stat"><div class="n">' + pool.length + '</div><div class="l">출제 가능 문법</div></div>' +
        '<div class="stat"><div class="n">' + stats.answered + '</div><div class="l">누적 푼 문제</div></div>' +
        '<div class="stat"><div class="n">' + rate + '%</div><div class="l">누적 정답률</div></div>' +
      '</div>' +
      '<div class="actions-row"><button class="btn primary blockbtn" data-act="quiz-start">퀴즈 시작 →</button></div>' +
      '<p style="font-size:11.5px;color:var(--faint);margin-top:9px">북마크 ' + store.bookmarks.length + '개 · 문법 카드의 ☆로 담을 수 있어요</p>' +
    '</div>';
  }

  function renderQuiz() {
    var body = document.getElementById('quizBody');
    var sub = document.getElementById('quizSub');
    var quiz = state.quiz;
    if (!quiz) {
      sub.textContent = '방금 본 문법을 바로 확인해 보세요. 뜻 고르기와 빈칸 채우기가 섞여 나옵니다.';
      body.innerHTML = quizIntroHtml();
      return;
    }
    if (quiz.error) {
      sub.textContent = '조건에 맞는 문법이 부족해요.';
      body.innerHTML = '<div class="quiz-intro"><h3>문법이 더 필요해요</h3>' +
        '<p>퀴즈를 만들려면 조건에 맞는 문법이 4개 이상 있어야 해요. 레벨을 넓히거나 북마크를 더 담아 주세요.</p>' +
        '<div class="actions-row"><button class="btn primary blockbtn" data-act="quiz-reset">처음으로</button></div></div>';
      return;
    }
    if (quiz.done) { body.innerHTML = quizResultHtml(quiz); return; }

    var it = quiz.items[quiz.idx];
    var total = quiz.items.length;
    var pct = Math.round((quiz.idx) / total * 100);

    var promptHtml;
    if (it.type === 'blank') {
      promptHtml = esc(it.prompt).replace(/＿＿/g, '<span class="blank">?</span>');
    } else {
      promptHtml = esc(it.prompt);
    }
    var koLine = (it.type === 'blank' && quiz.answered && it.ko) ? '<div class="qsub" style="margin-top:4px">' + esc(it.ko) + '</div>' : '';

    var opts = it.options.map(function (o, idx) {
      var cls = 'opt';
      if (quiz.answered) {
        if (o.ok) cls += ' correct';
        else if (quiz.picked === idx) cls += ' wrong';
      } else if (quiz.picked === idx) cls += ' picked';
      return '<button class="' + cls + '" data-act="quiz-answer" data-idx="' + idx + '" ' + (quiz.answered ? 'disabled' : '') + '>' +
        '<span class="idx">' + String.fromCharCode(65 + idx) + '</span><span>' + esc(o.text) + '</span></button>';
    }).join('');

    var fb = '';
    if (quiz.answered) {
      var ok = quiz.picked === it.correct;
      var entry = byId[it.entryId];
      fb = '<div class="fb ' + (ok ? '' : 'bad') + '">' +
        '<div class="fbh">' + (ok ? '⭕ 정답이에요!' : '❌ 아쉬워요') + '</div>' +
        '<div class="why"><span class="ptn">' + esc(entry.pattern) + '</span> · ' + esc(it.why) +
          (it.type === 'blank' && !ok ? '<br>정답 표기: <b>' + esc(it.answer) + '</b>' : '') + '</div>' +
        '<div class="act"><button data-act="quiz-open" data-id="' + entry.id + '">📖 문법 카드 열기</button></div>' +
      '</div>';
    }

    var nav = quiz.answered
      ? '<div class="qnav"><button class="btn primary blockbtn" data-act="quiz-next">' + (quiz.idx === total - 1 ? '결과 보기' : '다음 문제 →') + '</button></div>'
      : '<div class="qnav" style="visibility:hidden"><button class="btn blockbtn">다음 문제 →</button></div>';

    body.innerHTML = '<div class="qcard">' +
      '<div class="qhead"><span class="qtype">' + (it.type === 'blank' ? '빈칸 채우기' : '뜻 고르기') + '</span>' +
        '<span class="lv ' + byId[it.entryId].level + '">' + byId[it.entryId].level + '</span>' +
        '<span class="qcount">' + (quiz.idx + 1) + ' / ' + total + '</span></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="qsent">' + promptHtml + '</div>' +
      '<div class="qsub">' + esc(it.sub) + '</div>' + koLine +
      '<div class="opts">' + opts + '</div>' + fb + nav +
    '</div>';
  }

  function quizResultHtml(quiz) {
    var total = quiz.items.length;
    var score = quiz.correctCount;
    var pct = Math.round(score / total * 100);
    var msg = pct >= 90 ? '완벽에 가까워요! 이 레벨은 거의 정리됐어요.' :
      pct >= 70 ? '좋아요. 틀린 문법만 카드로 확인하면 더 단단해져요.' :
      pct >= 50 ? '절반은 잡았어요. 아래 틀린 문법을 하나씩 눌러 보세요.' :
      '괜찮아요. 틀린 문법을 카드로 보고 다시 풀면 금방 올라가요.';
    var wrong = quiz.log.filter(function (l) { return !l.ok; });
    var review = wrong.length ? '<div class="review">' + wrong.map(function (l) {
      var e = byId[l.entryId];
      if (!e) return '';
      return '<button data-open="' + e.id + '"><span class="ng">✕</span>' + levelLabel(e.level) +
        '<span style="flex:1">' + esc(e.pattern) + '</span><span style="color:var(--faint)">' + esc(e.meaning) + '</span></button>';
    }).join('') + '</div>' : '<p style="font-size:12.5px;color:var(--muted);margin-top:10px">틀린 문제가 없어요 🎉</p>';

    return '<div class="qresult">' +
      '<div class="score">' + score + '<span> / ' + total + '</span></div>' +
      '<div class="msg">' + esc(msg) + '</div>' +
      (wrong.length ? '<div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-top:16px;letter-spacing:.04em">틀린 문법 ' + wrong.length + '개</div>' : '') +
      review +
      '<div class="actions-row" style="margin-top:16px">' +
        '<button class="btn primary" style="flex:1" data-act="quiz-retry">다시 풀기</button>' +
        '<button class="btn ghost" data-act="quiz-reset">필터 바꾸기</button>' +
      '</div>' +
    '</div>';
  }

  function startQuiz() {
    state.quiz = buildQuiz(state.quizFilter);
    renderQuiz();
    scrollBelowHeader(document.getElementById('view-quiz'));
  }

  function answerQuiz(idx) {
    var q = state.quiz;
    if (!q || q.done || q.answered) return;
    var it = q.items[q.idx];
    q.picked = idx;
    q.answered = true;
    var ok = idx === it.correct;
    if (ok) q.correctCount++;
    q.log.push({ entryId: it.entryId, ok: ok });
    store.stats.answered++;
    if (ok) store.stats.correct++;
    saveStore();
    renderQuiz();
    var fb = document.querySelector('#quizBody .fb');
    if (fb && fb.scrollIntoView) {
      try { fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { fb.scrollIntoView(false); }
    }
  }

  function nextQuiz() {
    var q = state.quiz;
    if (!q) return;
    if (q.idx >= q.items.length - 1) { q.done = true; renderQuiz(); return; }
    q.idx++;
    q.picked = null;
    q.answered = false;
    renderQuiz();
  }

  function renderQuizAll() {
    renderQuizPills();
    if (!state.tab || state.tab === 'quiz') renderQuiz();
  }

  /* ---------------- tabs ---------------- */
  function headerHeight() {
    var h = document.querySelector('.appbar');
    return h ? h.getBoundingClientRect().height : 0;
  }

  function scrollBelowHeader(el) {
    if (!el) return;
    window.scrollTo(0, Math.max(0, el.offsetTop - headerHeight() - 8));
  }

  function setTab(tab) {
    state.tab = tab;
    document.body.classList.remove('tab-dict', 'tab-cmp', 'tab-quiz');
    document.body.classList.add('tab-' + tab);
    ['dict', 'cmp', 'quiz'].forEach(function (t) {
      var sec = document.getElementById('view-' + t);
      if (sec) sec.hidden = (t !== tab);
    });
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', String(tabs[i].getAttribute('data-tab') === tab));
    }
    if (tab === 'dict') {
      renderList();
    } else if (tab === 'cmp') {
      renderCompareList();
      renderCmpPickers();
    } else {
      renderQuiz();
    }
    window.scrollTo(0, 0);
  }

  /* ---------------- events ---------------- */
  function bind() {
    document.getElementById('levelPills').addEventListener('click', function (ev) {
      var btn = ev.target.closest('.pill');
      if (!btn) return;
      if (btn.getAttribute('data-star')) {
        state.starOnly = !state.starOnly;
      } else {
        state.level = btn.getAttribute('data-level');
      }
      renderPills();
      renderList();
    });

    document.getElementById('catSelect').addEventListener('change', function (ev) {
      state.cat = ev.target.value;
      renderList();
    });

    var search = document.getElementById('search');
    var timer = null;
    search.addEventListener('input', function () {
      var v = search.value;
      document.getElementById('clearSearch').hidden = !v;
      clearTimeout(timer);
      timer = setTimeout(function () {
        state.q = v;
        renderList();
      }, 70);
    });
    search.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        search.value = '';
        state.q = '';
        document.getElementById('clearSearch').hidden = true;
        renderList();
      }
    });
    document.getElementById('clearSearch').addEventListener('click', function () {
      search.value = '';
      state.q = '';
      this.hidden = true;
      renderList();
      search.focus();
    });

    document.getElementById('randomBtn').addEventListener('click', function () {
      var items = filteredEntries();
      if (!items.length) { toast('먼저 필터를 넓혀 주세요'); return; }
      openGrammar(items[Math.floor(Math.random() * items.length)].id);
    });

    document.getElementById('recentList').addEventListener('click', function (ev) {
      var btn = ev.target.closest('[data-open]');
      if (btn) openGrammar(btn.getAttribute('data-open'));
    });

    document.getElementById('grammarList').addEventListener('click', function (ev) {
      var star = ev.target.closest('[data-star]');
      if (star) {
        ev.stopPropagation();
        toggleStar(star.getAttribute('data-star'));
        return;
      }
      var item = ev.target.closest('[data-open]');
      if (item) openGrammar(item.getAttribute('data-open'));
    });
    document.getElementById('grammarList').addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var item = ev.target.closest('.gitem');
      if (!item) return;
      ev.preventDefault();
      openGrammar(item.getAttribute('data-open'));
    });

    document.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () { setTab(btn.getAttribute('data-tab')); });
    });

    document.getElementById('cmpSegment').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-cmptab]');
      if (!b) return;
      state.cmptab = b.getAttribute('data-cmptab');
      document.querySelectorAll('#cmpSegment button').forEach(function (x) {
        x.setAttribute('aria-selected', String(x.getAttribute('data-cmptab') === state.cmptab));
      });
      document.getElementById('cmpCurated').hidden = state.cmptab !== 'curated';
      document.getElementById('cmpCustom').hidden = state.cmptab !== 'custom';
      if (state.cmptab === 'custom') { state.cmpActive = -1; renderCmpPickers(); runCompare(); }
    });

    /* curated set search */
    var cmpFilter = document.getElementById('cmpFilter');
    var cmpTimer = null;
    cmpFilter.addEventListener('input', function () {
      var v = cmpFilter.value;
      document.getElementById('cmpFilterClear').hidden = !v;
      clearTimeout(cmpTimer);
      cmpTimer = setTimeout(function () { state.cmpQuery = v; renderCompareList(); }, 70);
    });
    cmpFilter.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        cmpFilter.value = '';
        state.cmpQuery = '';
        document.getElementById('cmpFilterClear').hidden = true;
        renderCompareList();
      }
    });
    document.getElementById('cmpFilterClear').addEventListener('click', function () {
      cmpFilter.value = '';
      state.cmpQuery = '';
      this.hidden = true;
      renderCompareList();
      cmpFilter.focus();
    });
    document.getElementById('cmpFilterReset').addEventListener('click', function () {
      cmpFilter.value = '';
      state.cmpQuery = '';
      document.getElementById('cmpFilterClear').hidden = true;
      renderCompareList();
    });

    /* A / B / C searchable picker */
    var custom = document.getElementById('cmpCustom');
    custom.addEventListener('click', function (ev) {
      var pick = ev.target.closest('[data-slotpick]');
      if (pick) { pickSlot(parseInt(pick.getAttribute('data-slotpick'), 10), pick.getAttribute('data-pickid')); return; }
      var edit = ev.target.closest('[data-slotedit]');
      if (edit) { editSlot(parseInt(edit.getAttribute('data-slotedit'), 10)); return; }
      var clr = ev.target.closest('[data-slotclear]');
      if (clr) { clearSlot(parseInt(clr.getAttribute('data-slotclear'), 10)); return; }
      var qclr = ev.target.closest('[data-slotqueryclear]');
      if (qclr) {
        var qi = parseInt(qclr.getAttribute('data-slotqueryclear'), 10);
        state.cmpQ[qi] = '';
        var qinp = document.getElementById('cmpQ' + SLOT_LETTERS[qi]);
        if (qinp) { qinp.value = ''; try { qinp.focus(); } catch (e) { /* noop */ } }
        renderCmpPickers();
        return;
      }
    });
    custom.addEventListener('focusin', function (ev) {
      var inp = ev.target.closest('[data-slotinput]');
      if (!inp) return;
      var i = parseInt(inp.getAttribute('data-slotinput'), 10);
      if (state.cmpActive !== i) {
        closeSlotLists(i);
        state.cmpActive = i;
        renderSlotList(i);
      }
    });
    custom.addEventListener('input', function (ev) {
      var inp = ev.target.closest('[data-slotinput]');
      if (!inp) return;
      var i = parseInt(inp.getAttribute('data-slotinput'), 10);
      state.cmpQ[i] = inp.value;
      state.cmpEdit[i] = true;
      state.cmpActive = i;
      var cb = custom.querySelector('[data-slotqueryclear="' + i + '"]');
      if (cb) cb.hidden = !inp.value;
      renderSlotList(i);
    });
    custom.addEventListener('keydown', function (ev) {
      var inp = ev.target.closest('[data-slotinput]');
      if (!inp) return;
      var i = parseInt(inp.getAttribute('data-slotinput'), 10);
      if (ev.key === 'Escape') {
        ev.preventDefault();
        state.cmpQ[i] = '';
        inp.value = '';
        var cb = custom.querySelector('[data-slotqueryclear="' + i + '"]');
        if (cb) cb.hidden = true;
        var box = document.getElementById('cmpL' + SLOT_LETTERS[i]);
        if (box) { box.hidden = true; box.innerHTML = ''; }
        return;
      }
      if (ev.key === 'Enter') {
        ev.preventDefault();
        var first = custom.querySelector('#cmpL' + SLOT_LETTERS[i] + ' [data-pickid]');
        if (first) pickSlot(i, first.getAttribute('data-pickid'));
        return;
      }
    });

    document.getElementById('cmpRun').addEventListener('click', function () {
      renderCmpPickers();
      runCompare();
      var box = document.getElementById('cmpCustomResult');
      if (box && box.firstChild) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('cmpReset').addEventListener('click', function () {
      state.cmpPick = ['', '', ''];
      state.cmpEdit = [false, false, false];
      state.cmpQ = ['', '', ''];
      state.cmpActive = -1;
      renderCmpPickers();
      runCompare();
      toast('A·B·C를 모두 비웠어요');
    });

    document.addEventListener('click', function (ev) {
      if (state.cmpActive === -1) return;
      var el = ev.target;
      if (el && el.closest && el.closest('#cmpCustom .slot')) return;
      closeSlotLists(-1);
    });

    document.getElementById('cmpList').addEventListener('click', function (ev) {
      var openBtn = ev.target.closest('[data-open]');
      if (openBtn) { openGrammar(openBtn.getAttribute('data-open')); return; }
      var tgl = ev.target.closest('[data-cmptoggle]');
      if (!tgl) return;
      var id = tgl.getAttribute('data-cmptoggle');
      state.openCmp[id] = !state.openCmp[id];
      renderCompareList();
    });

    document.getElementById('quizPills').addEventListener('click', function (ev) {
      var btn = ev.target.closest('[data-qlevel]');
      if (!btn) return;
      state.quizFilter = btn.getAttribute('data-qlevel');
      state.quiz = null;
      renderQuizPills();
      renderQuiz();
    });

    document.getElementById('modalRoot').addEventListener('click', function (ev) {
      var actEl = ev.target.closest('[data-act]');
      if (actEl) {
        var act = actEl.getAttribute('data-act');
        if (act === 'close') { closeModal(); return; }
        if (act === 'backdrop' && ev.target === actEl) { closeModal(); return; }
        if (act === 'mstar') { toggleStar(actEl.getAttribute('data-id')); return; }
        if (act === 'say') {
          var r = parseFloat(actEl.getAttribute('data-rate') || state.rate) || 1;
          if (actEl.hasAttribute('data-rate')) {
            state.rate = r;
            var rb = document.querySelectorAll('.ratebtn');
            for (var i = 0; i < rb.length; i++) {
              rb[i].classList.toggle('on', parseFloat(rb[i].getAttribute('data-rate')) === r);
            }
          }
          speak(actEl.getAttribute('data-text'), r);
          return;
        }
        if (act === 'tog-rd') {
          state.showRd = !state.showRd;
          document.body.classList.toggle('show-rd', state.showRd);
          actEl.setAttribute('aria-pressed', String(state.showRd));
          return;
        }
        if (act === 'tog-ko') {
          state.showKo = !state.showKo;
          document.body.classList.toggle('hide-ko', !state.showKo);
          actEl.setAttribute('aria-pressed', String(state.showKo));
          return;
        }
        if (act === 'compare') {
          var id = actEl.getAttribute('data-id');
          var e = byId[id];
          var picks = [id];
          (e.similarIds || []).forEach(function (sid) { if (byId[sid] && picks.length < 3) picks.push(sid); });
          state.cmpPick = [picks[0] || '', picks[1] || '', picks[2] || ''];
          state.cmpEdit = [false, false, false];
          state.cmpQ = ['', '', ''];
          state.cmpActive = -1;
          closeModal();
          setTab('cmp');
          state.cmptab = 'custom';
          document.querySelectorAll('#cmpSegment button').forEach(function (x) {
            x.setAttribute('aria-selected', String(x.getAttribute('data-cmptab') === 'custom'));
          });
          document.getElementById('cmpCurated').hidden = true;
          document.getElementById('cmpCustom').hidden = false;
          renderCmpPickers();
          runCompare();
          state.pendingTop = true;
          window.scrollTo(0, 0);
          setTimeout(function () { window.scrollTo(0, 0); }, 60);
          return;
        }
      }
      var openEl = ev.target.closest('[data-open]');
      if (openEl) {
        var gid = openEl.getAttribute('data-open');
        if (gid) openGrammar(gid, { focus: false });
      }
    });

    document.getElementById('quizBody').addEventListener('click', function (ev) {
      var actEl = ev.target.closest('[data-act]');
      if (actEl) {
        var act = actEl.getAttribute('data-act');
        if (act === 'quiz-start') { startQuiz(); return; }
        if (act === 'quiz-answer') { answerQuiz(parseInt(actEl.getAttribute('data-idx'), 10)); return; }
        if (act === 'quiz-next') { nextQuiz(); return; }
        if (act === 'quiz-retry') { startQuiz(); return; }
        if (act === 'quiz-reset') { state.quiz = null; renderQuiz(); return; }
        if (act === 'quiz-open') { openGrammar(actEl.getAttribute('data-id')); return; }
      }
      var openEl = ev.target.closest('[data-open]');
      if (openEl) openGrammar(openEl.getAttribute('data-open'));
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && state.modalId) { closeModal(); return; }
      if (ev.key === '/' && document.activeElement !== search && !state.modalId) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') {
          ev.preventDefault();
          search.focus();
        }
      }
    });
  }

  /* ---------------- init ---------------- */
  function init() {
    document.body.classList.add('tab-dict');
    document.getElementById('totalCount').textContent = ENTRIES.length;
    renderPills();
    renderCatSelect();
    renderList();
    renderCmpPickers();
    renderCompareList();
    runCompare();
    renderQuizPills();
    renderQuiz();
    bind();
  }

  init();

  window.__APP__ = {
    DATA: DATA,
    ENTRIES: ENTRIES,
    CMP: CMP,
    QUIZBANK: QUIZBANK,
    state: state,
    store: store,
    byId: byId,
    norm: norm,
    searchEntries: searchEntries,
    searchComparisons: searchComparisons,
    filteredEntries: filteredEntries,
    pickSlot: pickSlot,
    runCompare: runCompare,
    renderCmpPickers: renderCmpPickers,
    buildQuiz: buildQuiz,
    openGrammar: openGrammar,
    setTab: setTab,
    startQuiz: startQuiz,
    isStarred: isStarred
  };
})();

</script>
</body>
</html>
